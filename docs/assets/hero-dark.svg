<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Post-quantum cryptography on an ESP32-C3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<rect x="0.5" y="0.5" width="959" height="355" rx="12" fill="#0d1117" stroke="#3d444d"/>
<text x="44.0" y="58.0" font-size="12.5" fill="#9198a1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.04em">RV32IMC  ·  160 MHz  ·  385 KB RAM  ·  NO FPU</text>
<text x="44.0" y="108.0" font-size="38" fill="#f0f6fc" font-weight="700">Post-quantum cryptography</text>
<text x="44.0" y="154.0" font-size="38" fill="#f0f6fc" font-weight="700">on an ESP32-C3</text>
<rect x="44.0" y="170.0" width="56.0" height="4.0" rx="2" fill="#3987e5"/>
<text x="44.0" y="202.0" font-size="15" fill="#9198a1">The NIST standards and the Chinese algorithms: ported, checked on the chip</text>
<text x="44.0" y="224.0" font-size="15" fill="#9198a1">against known answers, measured, and made faster for this particular core.</text>
<rect x="44.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="60.0" y="281.0" font-size="24" fill="#f0f6fc" font-weight="650">34</text>
<text x="60.0" y="300.0" font-size="11.5" fill="#9198a1">suites, one RAM image each</text>
<rect x="265.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="281.0" y="281.0" font-size="24" fill="#f0f6fc" font-weight="650">1,306</text>
<text x="281.0" y="300.0" font-size="11.5" fill="#9198a1">measured jobs, all passing</text>
<rect x="486.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="502.0" y="281.0" font-size="24" fill="#f0f6fc" font-weight="650">1,004</text>
<text x="502.0" y="300.0" font-size="11.5" fill="#9198a1">output fingerprints equal to the</text>
<text x="502.0" y="315.0" font-size="11.5" fill="#9198a1">host</text>
<rect x="707.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#151b23" stroke="#3d444d"/>
<text x="723.0" y="281.0" font-size="24" fill="#f0f6fc" font-weight="650">0</text>
<text x="723.0" y="300.0" font-size="11.5" fill="#9198a1">bytes written to the board's</text>
<text x="723.0" y="315.0" font-size="11.5" fill="#9198a1">flash</text>
