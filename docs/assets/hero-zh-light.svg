<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="ESP32-C3 上的 后量子密码" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<rect x="0.5" y="0.5" width="959" height="355" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<text x="44.0" y="58.0" font-size="12.5" fill="#59636e" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" letter-spacing="0.04em">RV32IMC  ·  160 MHz  ·  385 KB 内存  ·  无浮点单元</text>
<text x="44.0" y="108.0" font-size="38" fill="#1f2328" font-weight="700">ESP32-C3 上的</text>
<text x="44.0" y="154.0" font-size="38" fill="#1f2328" font-weight="700">后量子密码</text>
<rect x="44.0" y="170.0" width="56.0" height="4.0" rx="2" fill="#2a78d6"/>
<text x="44.0" y="202.0" font-size="15" fill="#59636e">NIST 标准与中国算法：逐个移植，在芯片上用已知答案校验、实测，</text>
<text x="44.0" y="224.0" font-size="15" fill="#59636e">再针对这颗内核做性能优化。</text>
<rect x="44.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="60.0" y="281.0" font-size="24" fill="#1f2328" font-weight="650">34</text>
<text x="60.0" y="300.0" font-size="11.5" fill="#59636e">个套件，各一个内存镜像</text>
<rect x="265.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="281.0" y="281.0" font-size="24" fill="#1f2328" font-weight="650">1,306</text>
<text x="281.0" y="300.0" font-size="11.5" fill="#59636e">项实测，全部通过</text>
<rect x="486.0" y="250.0" width="209.0" height="78.0" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
